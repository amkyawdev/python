<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8D4E3"/>
      <stop offset="100%" style="stop-color:#8BB8CC"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#6B7280" stroke-width="2"/>
  <!-- Python Logo P -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">P</text>
  <!-- Q letter -->
  <text x="65" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6B7280" text-anchor="middle">?</text>
</svg>